<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dr Graph — Work in progress</title>
  <meta name="description" content="Dr Graph is taking shape.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#03040b">
  <meta property="og:title" content="Dr Graph — Work in progress">
  <meta property="og:description" content="The future of longevity will pass through here.">
  <meta property="og:type" content="website">
  <style>

    :root {
      color-scheme: dark;
      --bg: #03040b;
      --bg-soft: #07091a;
      --text: #f4f6ff;
      --muted: #aeb5c9;
      --dim: #6e7895;
      --line: rgba(181, 199, 255, 0.18);
      --violet: #8b5cf6;
      --cyan: #38bdf8;
      --blue: #60a5fa;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 76% 44%, rgba(88, 72, 255, 0.22), transparent 34rem),
        radial-gradient(circle at 18% 76%, rgba(56, 189, 248, 0.08), transparent 28rem),
        linear-gradient(135deg, #02030a 0%, #050716 42%, #071126 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(circle at 50% 35%, black, transparent 78%);
      opacity: 0.32;
    }

    .page {
      min-height: 100vh;
      position: relative;
      isolation: isolate;
      overflow-x: hidden;
    }

    .glow {
      position: absolute;
      inset: auto -12rem 0 auto;
      width: 52rem;
      height: 52rem;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(56,189,248,0.18), rgba(139,92,246,0.10) 38%, transparent 68%);
      filter: blur(22px);
      z-index: -2;
    }

    .shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.03em;
      font-weight: 620;
      font-size: 1.18rem;
    }

    .brand svg {
      width: 37px;
      height: 37px;
      overflow: visible;
      filter: drop-shadow(0 0 18px rgba(96,165,250,0.35));
    }

    nav {
      display: flex;
      align-items: center;
      gap: clamp(18px, 4vw, 48px);
      color: rgba(244,246,255,0.62);
      font-size: 0.9rem;
      letter-spacing: 0.01em;
    }

    nav a {
      color: inherit;
      text-decoration: none;
      cursor: default;
    }

    .pulse {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--violet), var(--cyan));
      box-shadow: 0 0 22px rgba(139,92,246,0.9), 0 0 44px rgba(56,189,248,0.25);
    }

    .hero {
      min-height: calc(100vh - 92px);
      display: grid;
      grid-template-columns: minmax(0, 1.02fr) minmax(0, 0.98fr);
      align-items: center;
      gap: clamp(28px, 4vw, 60px);
      padding: 40px 0 64px;
    }

    .copy { max-width: 620px; min-width: 0; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 35px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #b8c7ff;
      background: rgba(9, 13, 32, 0.52);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      text-transform: uppercase;
      font-size: 0.76rem;
      letter-spacing: 0.34em;
    }

    .eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--cyan);
      box-shadow: 0 0 16px rgba(56,189,248,0.8);
    }

    h1 {
      margin: 34px 0 0;
      font-size: clamp(2.85rem, 6.1vw, 6.4rem);
      line-height: 0.98;
      letter-spacing: -0.06em;
      font-weight: 520;
    }

    .gradient-text {
      background: linear-gradient(110deg, #ffffff 0%, #eef3ff 42%, #aac7ff 72%, #cab8ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subhead {
      margin: 30px 0 0;
      max-width: 520px;
      color: rgba(244,246,255,0.68);
      font-size: clamp(1.08rem, 1.8vw, 1.32rem);
      line-height: 1.6;
      letter-spacing: -0.015em;
    }

    .visual {
      position: relative;
      min-height: 610px;
      min-width: 0;
      display: grid;
      place-items: center;
    }

    .visual::before {
      content: "";
      position: absolute;
      width: 112%;
      aspect-ratio: 1;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(139,92,246,0.22), transparent 58%);
      filter: blur(20px);
      z-index: -1;
    }

    .visual-card {
      position: relative;
      width: min(560px, 100%);
      aspect-ratio: 1.1 / 1;
      border-radius: 44px;
      overflow: hidden;
      mask-image: radial-gradient(circle at 52% 50%, black 0 54%, rgba(0,0,0,0.82) 66%, transparent 81%);
    }

    .visual-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.06) contrast(1.05);
      opacity: 0.98;
    }

    .visual-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(3,4,11,0.85), transparent 28%, rgba(3,4,11,0.05));
      pointer-events: none;
    }

    .tiny-proof {
      position: absolute;
      left: 0;
      bottom: 26px;
      color: var(--dim);
      font-size: 0.76rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .scroll {
      position: absolute;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%);
      display: grid;
      place-items: center;
      gap: 14px;
      color: rgba(244,246,255,0.45);
      font-size: 0.67rem;
      letter-spacing: 0.42em;
      text-transform: uppercase;
    }

    .scroll span:first-child {
      width: 1px;
      height: 46px;
      background: linear-gradient(transparent, rgba(184,199,255,0.9), transparent);
      box-shadow: 0 0 18px rgba(139,92,246,0.62);
    }

    @media (max-width: 1024px) {
      header { height: 78px; }
      nav a { display: none; }
      .hero {
        min-height: auto;
        grid-template-columns: 1fr;
        padding: 28px 0 96px;
      }
      .visual {
        min-height: 360px;
        margin-top: -16px;
        order: -1;
        opacity: 0.9;
      }
      .visual-card {
        width: min(560px, 100%);
      }
      h1 { margin-top: 26px; }
      .tiny-proof { display: none; }
    }

    @media (max-width: 560px) {
      .shell { width: min(100% - 28px, 1180px); }
      .brand { font-size: 1.05rem; }
      .brand svg { width: 32px; height: 32px; }
      .eyebrow { letter-spacing: 0.24em; font-size: 0.68rem; }
      .visual { min-height: 300px; }
      .visual-card { width: min(440px, 100%); }
      h1 { letter-spacing: -0.045em; }
      .subhead { margin-top: 22px; }
      .scroll { display: none; }
    }

  </style>
</head>
